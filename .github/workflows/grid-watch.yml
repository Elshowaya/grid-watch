name: grid-watch
on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours; exits fast when PG&E data is unchanged
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: ./run_all.sh
      - name: Commit only if something changed
        run: |
          git config user.name "grid-watch-bot"
          git config user.email "grid-watch-bot@users.noreply.github.com"
          git add -A data reports
          git diff --cached --quiet || git commit -m "grid-watch $(date -u +%F_%H%M)" && git push
  laws:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install Bend
        run: |
          curl -fsSL https://bend-lang.com/install.sh | BEND_NO_TELEMETRY=1 sh
          echo "$HOME/.bend/bin" >> "$GITHUB_PATH"
      - name: Proof gate and cross-check
        env: { BEND_NO_TELEMETRY: "1" }
        run: ./bend/check.sh
